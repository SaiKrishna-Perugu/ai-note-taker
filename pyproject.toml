[project]
name = "ai-note-taker"
version = "0.1.0"
description = "Background Windows meeting recorder with AI transcripts and structured notes"
readme = "README.md"
authors = [
    { name = "SaiKrishna-Perugu", email = "p.saikrishna355@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.30.1",
    "psutil>=7.0",
    "pyaudiowpatch>=0.2.12.8 ; sys_platform == 'win32'",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
    "sarvamai>=0.1.37",
]

[project.scripts]
ai-note-taker = "ai_note_taker:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
